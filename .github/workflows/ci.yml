name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Generate build configuration
        run: cp CommandStation-EX/config.example.h CommandStation-EX/config.h
      - name: Build EX-CSB1 firmware
        run: pio run -e ESP32
      - name: Build LittleFS image
        run: pio run -e ESP32 -t buildfs

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Avalonia installer
        run: dotnet build installer/DCCExpressLite.Installer/DCCExpressLite.Installer.csproj -c Release --configfile installer/NuGet.Config
