name: DCCExpressLite release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: true
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install PlatformIO
        run: pip install platformio
      - name: Generate web UI version metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          @{ version = $version } | ConvertTo-Json -Compress | Set-Content data/version.json -Encoding utf8NoBOM
      - name: Build embedded web UI
        run: |
          npm ci --prefix web-ui
          npm run embed --prefix web-ui
      - name: Build firmware and LittleFS
        run: |
          pio run -e ESP32
          pio run -e ESP32 -t buildfs
      - name: Verify embedded starter data
        run: |
          for file in layout.json locos.json signal-rules.json devices.json images/bobo.png images/csorgo.png images/szergej.png images/traxx.png; do
            test -s "data/$file"
          done
      - name: Build merged firmware
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          ./tools/New-MergedFirmware.ps1 -Version $version
      - name: Build web installer release index
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $tagName = "v$version"
          $webRoot = 'artifacts/webinstaller'
          $pagesBase = 'https://dccexpress.github.io/DCCExpressLite'
          $entries = [System.Collections.Generic.List[object]]::new()
          $currentDirectory = Join-Path $webRoot "firmware/$tagName"
          New-Item -ItemType Directory -Path $currentDirectory -Force | Out-Null
          Copy-Item "artifacts/firmware/DCCExpressLite-$version-merged.bin" (Join-Path $currentDirectory 'merged-firmware.bin') -Force
          $currentManifest = [ordered]@{
            name = 'DCCExpressLite'
            version = $version
            new_install_prompt_erase = $true
            builds = @(@{ chipFamily = 'ESP32'; improv = $false; parts = @(@{ path = 'merged-firmware.bin'; offset = 0 }) })
          }
          ConvertTo-Json -InputObject $currentManifest -Depth 6 | Set-Content (Join-Path $currentDirectory 'manifest.json') -Encoding utf8NoBOM
          $entries.Add([ordered]@{
            tagName = $tagName
            prerelease = $version.Contains('-')
            manifestUrl = "$pagesBase/firmware/$tagName/manifest.json"
          })

          $published = gh api 'repos/${{ github.repository }}/releases?per_page=100' | ConvertFrom-Json
          foreach ($release in $published) {
            if ($release.draft -or $release.tag_name -eq $tagName) { continue }
            $asset = $release.assets | Where-Object { $_.name -match '^DCCExpressLite-.+-merged\.bin$' } | Select-Object -First 1
            if ($asset) {
              $releaseDirectory = Join-Path $webRoot "firmware/$($release.tag_name)"
              New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile (Join-Path $releaseDirectory 'merged-firmware.bin')
              $releaseVersion = $release.tag_name.TrimStart('v')
              $releaseManifest = [ordered]@{
                name = 'DCCExpressLite'
                version = $releaseVersion
                new_install_prompt_erase = $true
                builds = @(@{ chipFamily = 'ESP32'; improv = $false; parts = @(@{ path = 'merged-firmware.bin'; offset = 0 }) })
              }
              ConvertTo-Json -InputObject $releaseManifest -Depth 6 | Set-Content (Join-Path $releaseDirectory 'manifest.json') -Encoding utf8NoBOM
              $entries.Add([ordered]@{
                tagName = $release.tag_name
                prerelease = [bool]$release.prerelease
                manifestUrl = "$pagesBase/firmware/$($release.tag_name)/manifest.json"
              })
            }
          }

          ConvertTo-Json -InputObject $entries -Depth 4 | Set-Content artifacts/webinstaller/releases.json -Encoding utf8NoBOM
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-firmware-release
          path: artifacts/firmware/DCCExpressLite-*-merged.bin
          if-no-files-found: error
      - name: Upload web installer for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/webinstaller

  github-release:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: merged-firmware-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          prerelease_flag=""
          if [[ "$version" == *-* ]]; then prerelease_flag="--prerelease"; fi
          gh release create "v$version" release/* --repo "$GITHUB_REPOSITORY" --title "DCCExpressLite v$version" --generate-notes $prerelease_flag

  deploy-web-installer:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web installer
        id: deployment
        uses: actions/deploy-pages@v4
