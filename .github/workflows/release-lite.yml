name: DCCExpressLite release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install PlatformIO
        run: pip install platformio
      - name: Generate build configuration
        run: cp CommandStation-EX/config.example.h CommandStation-EX/config.h
      - name: Generate web UI version metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          @{ version = $version } | ConvertTo-Json -Compress | Set-Content data/version.json -Encoding utf8NoBOM
      - name: Build embedded web UI
        run: |
          npm ci --prefix web-ui
          npm run embed --prefix web-ui
      - name: Build firmware and LittleFS
        run: |
          pio run -e ESP32
          pio run -e ESP32 -t buildfs
      - name: Build firmware release manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $base = '${{ github.server_url }}/${{ github.repository }}/releases/download/v' + $version
          ./tools/New-FirmwareManifest.ps1 -Version $version -BaseUrl $base
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: artifacts/firmware/*
      - name: Upload web installer for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/webinstaller

  github-release:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          prerelease_flag=""
          if [[ "$version" == *-* ]]; then prerelease_flag="--prerelease"; fi
          gh release create "v$version" release/* --repo "$GITHUB_REPOSITORY" --title "DCCExpressLite v$version" --generate-notes $prerelease_flag

  deploy-web-installer:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web installer
        id: deployment
        uses: actions/deploy-pages@v4
