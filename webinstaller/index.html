<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>DCCExpressLite Web Installer</title>

  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module">
  </script>

  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(37, 99, 235, .20),
          transparent 35rem
        ),
        #090d16;

      color: #e5e7eb;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
      background: rgba(17, 24, 39, .92);
      border: 1px solid #273244;
      border-radius: 22px;
      padding: clamp(22px, 5vw, 42px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 6vw, 48px);
      letter-spacing: -.03em;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .language-switch {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .language-switch button {
      border: 1px solid #334155;
      border-radius: 9px;
      background: #111827;
      color: #94a3b8;
      padding: 7px 11px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .language-switch button.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
    }

    .version {
      display: inline-block;
      margin: 8px 0 24px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #172033;
      border: 1px solid #2b3a55;
      font-size: 14px;
      color: #bfdbfe;
    }

    p,
    li {
      line-height: 1.65;
      color: #cbd5e1;
    }

    a {
      color: #60a5fa;
    }

    a:hover {
      color: #93c5fd;
    }

    .panel {
      margin: 24px 0;
      padding: 20px;
      border-radius: 16px;
      background: #0d1422;
      border: 1px solid #253148;
    }

    .warning {
      border-color: #7c5b17;
      background: #1d180c;
    }

    .success {
      border-color: #166534;
      background: #0b1d14;
    }

    .important-list {
      margin-bottom: 0;
      padding-left: 22px;
    }

    esp-web-install-button {
      display: block;
      margin: 28px 0 16px;
    }

    esp-web-install-button::part(activate),
    button.install-action {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: #111827;
      color: #93c5fd;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #111827;
      color: #f8fafc;
      padding: 10px 12px;
      font: inherit;
    }

    select {
      cursor: pointer;
    }

    #release-status {
      min-height: 1.5em;
      margin: 8px 0 0;
      color: #93c5fd;
    }

    button.serial-action {
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      background: #059669;
      color: white;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    #serial-status {
      min-height: 1.5em;
      margin-bottom: 0;
      color: #a7f3d0;
    }

    footer {
      margin-top: 28px;
      color: #64748b;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .topbar {
        flex-direction: column;
      }

      .language-switch {
        align-self: flex-end;
      }
    }
  </style>
</head>

<body>

<main>

  <div class="topbar">
    <div>
      <h1>DCCExpressLite</h1>

      <div
        class="version"
        id="installer-version">
        ESP32 / EX-CSB1
      </div>
    </div>

    <div
      class="language-switch"
      aria-label="Language">

      <button
        id="lang-hu"
        type="button">
        HU
      </button>

      <button
        id="lang-en"
        type="button">
        EN
      </button>

    </div>
  </div>


  <p data-i18n="intro"></p>


  <!-- BEFORE INSTALLATION -->

  <div class="panel warning">

    <h2 data-i18n="beforeInstallTitle"></h2>

    <ul class="important-list">

      <li>
        <span data-i18n="driverText1"></span>

        <a
          href="https://www.wch.cn/downloads/"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="driverLink">
        </a>

        <span data-i18n="driverText2"></span>
      </li>

      <li data-i18n="backupWarning"></li>

      <li data-i18n="usbCableWarning"></li>

      <li data-i18n="browserWarning"></li>

    </ul>

  </div>


  <!-- INSTALL -->

  <div class="panel">

    <h2 data-i18n="installationTitle"></h2>

    <ol>

      <li data-i18n="installStep1"></li>

      <li data-i18n="installStep2"></li>

      <li data-i18n="installStep3"></li>

      <li data-i18n="installStep4"></li>

    </ol>


    <label
      for="release-select"
      data-i18n="releaseLabel">
    </label>


    <select
      id="release-select"
      disabled>

      <option
        value=""
        data-i18n="loadingVersions">
      </option>

    </select>


    <p
      id="release-status"
      role="status">
    </p>


    <esp-web-install-button
      id="install-button"
      manifest="manifest.json">

      <button
        class="install-action"
        slot="activate"
        data-i18n="installButton">
      </button>


      <span
        slot="unsupported"
        data-i18n="unsupportedBrowser">
      </span>

    </esp-web-install-button>

  </div>


  <!-- WIFI -->

  <div class="panel">

    <h2 data-i18n="wifiTitle"></h2>

    <p data-i18n="wifiDescription"></p>


    <label for="wifi-ssid">
      SSID
    </label>

    <input
      id="wifi-ssid"
      maxlength="32"
      autocomplete="off"
      data-i18n-placeholder="wifiSsidPlaceholder">


    <label
      for="wifi-password"
      data-i18n="passwordLabel">
    </label>

    <input
      id="wifi-password"
      type="password"
      minlength="8"
      maxlength="63"
      autocomplete="new-password"
      data-i18n-placeholder="wifiPasswordPlaceholder">


    <button
      class="serial-action"
      id="configure-wifi"
      type="button"
      data-i18n="wifiSaveButton">
    </button>


    <p
      id="serial-status"
      role="status">
    </p>


    <p>

      <span
        data-i18n="serialCommandIntro">
      </span>

      <br>

      <code>
        &lt;WIFI "HomeSSID" "password"&gt;
      </code>

    </p>

  </div>


  <!-- AFTER INSTALLATION -->

  <div class="panel success">

    <h2 data-i18n="afterInstallTitle"></h2>

    <ol>

      <li data-i18n="afterStep1"></li>

      <li data-i18n="afterStep2"></li>

      <li data-i18n="afterStep3"></li>

      <li data-i18n="afterStep4"></li>

    </ol>

  </div>


  <!-- FALLBACK -->

  <div class="panel warning">

    <h2 data-i18n="fallbackTitle"></h2>

    <p>

      <span
        data-i18n="fallbackDescription1">
      </span>

      <code>
        192.168.4.1
      </code>

      <span
        data-i18n="fallbackDescription2">
      </span>

    </p>

  </div>


  <p data-i18n="mergedFirmwareDescription"></p>


  <footer>
    DCCExpressLite Web Installer
  </footer>

</main>

      webSerialUnsupported:

        "The password must be between 8 and 63 characters.",


      invalidQuotes:

      chooseSerialPort:
        "Select the EX-CSB1 serial port again…",

  const releasesUrl =
    "https://api.github.com/repos/DCCExpress/DCCExpressLite/releases?per_page=30";


  const releaseSelect =
    document.getElementById("release-select");


  const releaseStatus =
    document.getElementById("release-status");


  const installerVersion =
    document.getElementById("installer-version");


  const wifiButton =
    document.getElementById("configure-wifi");


  const serialStatus =
    document.getElementById("serial-status");


  const langHuButton =
    document.getElementById("lang-hu");


  const langEnButton =
    document.getElementById("lang-en");


  let releases = [];

  let currentRelease = null;


  function getInitialLanguage() {

    const saved =
      localStorage.getItem(
        "dccexpress-installer-language"
      );


    if (
      saved === "hu" ||
      saved === "en"
    ) {
      return saved;
    }


    return navigator.language
      ?.toLowerCase()
      .startsWith("hu")
        ? "hu"
        : "en";

  }


  let currentLanguage =
    getInitialLanguage();


  function t(key) {

    return (
      translations[currentLanguage][key]
      ?? key
    );

  }


  function applyLanguage(language) {

    currentLanguage =
      language;


    localStorage.setItem(
      "dccexpress-installer-language",
      language
    );


    document.documentElement.lang =
      language;


    document
      .querySelectorAll("[data-i18n]")
      .forEach(element => {

        const key =
          element.dataset.i18n;

        element.textContent =
          t(key);

      });


    document
      .querySelectorAll(
        "[data-i18n-placeholder]"
      )
      .forEach(element => {

        const key =
          element.dataset.i18nPlaceholder;

        element.placeholder =
          t(key);

      });


    langHuButton.classList.toggle(
      "active",
      language === "hu"
    );


    langEnButton.classList.toggle(
      "active",
      language === "en"
    );


    rebuildReleaseOptions();


    if (currentRelease) {

      updateSelectedReleaseText(
        currentRelease
      );

    }

  }


  langHuButton.addEventListener(
    "click",
    () => applyLanguage("hu")
  );


  langEnButton.addEventListener(
    "click",
    () => applyLanguage("en")
  );


  function setInstallManifest(
    manifestUrl
  ) {

    const oldButton =
      document.getElementById(
        "install-button"
      );


    const newButton =
      oldButton.cloneNode(true);


    newButton.setAttribute(
      "manifest",
      manifestUrl
    );


    oldButton.replaceWith(
      newButton
    );

  }


  function updateSelectedReleaseText(
    release
  ) {

    installerVersion.textContent =
      `${release.tagName} · ESP32 / EX-CSB1`;


    releaseStatus.textContent =
      release.prerelease
        ? t("prereleaseSelected")
        : t("stableSelected");

  }


  function selectRelease(release) {

    if (!release) {
      return;
    }


    currentRelease =
      release;


    setInstallManifest(
      release.manifestUrl
    );


    updateSelectedReleaseText(
      release
    );

  }


  function rebuildReleaseOptions() {

    if (!releases.length) {

      releaseSelect.replaceChildren(
        new Option(
          t("loadingVersions"),
          ""
        )
      );

      return;

    }


    const selectedIndex =
      currentRelease
        ? releases.findIndex(
            release =>
              release.tagName ===
              currentRelease.tagName
          )
        : 0;


    releaseSelect.replaceChildren(

      ...releases.map(
        (release, index) => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            String(index);


          const channel =
            release.prerelease
              ? t("versionTest")
              : t("versionStable");


          const latest =
            index === 0
              ? ` · ${t("latest")}`
              : "";


          option.textContent =
            `${release.tagName} · ${channel}${latest}`;


          return option;

        }
      )

    );


    releaseSelect.value =
      String(
        selectedIndex >= 0
          ? selectedIndex
          : 0
      );

  }


  async function fetchReleaseIndex() {

    const response =
      await fetch(
        "releases.json",
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `Release index: ${response.status}`
      );

    }


    return response.json();

  }


  async function fetchGitHubReleases() {

    const response =
      await fetch(
        releasesUrl,
        {
          cache: "no-store",

          headers: {
            Accept:
              "application/vnd.github+json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        `GitHub API: ${response.status}`
      );

    }


    return (
      await response.json()
    )

      .filter(
        release =>
          !release.draft
      )

      .map(
        release => ({

          tagName:
            release.tag_name,

          prerelease:
            release.prerelease,

          manifestUrl:
            release.assets.some(
              asset =>
                /^DCCExpressLite-.+-merged\.bin$/
                  .test(asset.name)
            )
              ? `https://dccexpress.github.io/DCCExpressLite/firmware/${release.tag_name}/manifest.json`
              : null

        })
      )

      .filter(
        release =>
          release.manifestUrl
      );

  }


  async function loadReleases() {

    try {

      try {

        releases =
          await fetchReleaseIndex();

      }
      catch (_) {

        releases =
          await fetchGitHubReleases();

      }


      if (!releases.length) {

        throw new Error(
          t("noInstallableRelease")
        );

      }


      rebuildReleaseOptions();


      releaseSelect.disabled =
        false;


      releaseSelect.addEventListener(
        "change",
        () => {

          selectRelease(
            releases[
              Number(
                releaseSelect.value
              )
            ]
          );

        }
      );


      selectRelease(
        releases[0]
      );

    }
    catch (error) {

      releases = [];


      releaseSelect.replaceChildren(
        new Option(
          t(
            "latestPublishedVersion"
          ),
          ""
        )
      );


      releaseStatus.textContent =
        t(
          "versionsUnavailable"
        );


      fetch(
        "manifest.json",
        {
          cache: "no-store"
        }
      )

        .then(
          response =>
            response.ok
              ? response.json()
              : null
        )

        .then(
          manifest => {

            if (
              manifest?.version
            ) {

              installerVersion.textContent =
                `v${manifest.version} · ESP32 / EX-CSB1`;

            }

          }
        )

        .catch(
          () => undefined
        );

    }

  }


  wifiButton.addEventListener(
    "click",
    async () => {

      const ssid =
        document.getElementById(
          "wifi-ssid"
        ).value;


      const password =
        document.getElementById(
          "wifi-password"
        ).value;


      if (!navigator.serial) {

        serialStatus.textContent =
          t(
            "webSerialUnsupported"
          );

        return;

      }


      if (
        !ssid ||
        ssid.length > 32
      ) {

        serialStatus.textContent =
          t("invalidSsid");

        return;

      }


      if (
        password.length < 8 ||
        password.length > 63
      ) {

        serialStatus.textContent =
          t(
            "invalidPassword"
          );

        return;

      }


      if (
        ssid.includes('"') ||
        password.includes('"')
      ) {

        serialStatus.textContent =
          t("invalidQuotes");

        return;

      }


      wifiButton.disabled =
        true;


      let port;


      try {

        serialStatus.textContent =
          t(
            "chooseSerialPort"
          );


        port =
          await navigator.serial
            .requestPort();


        await port.open({
          baudRate: 115200
        });


        serialStatus.textContent =
          t("deviceStarting");


        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              2500
            )
        );


        const writer =
          port.writable.getWriter();


        await writer.write(
          new TextEncoder().encode(
            `<WIFI "${ssid}" "${password}">\n`
          )
        );


        writer.releaseLock();


        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              1400
            )
        );


        serialStatus.textContent =
          t("wifiSent");

      }
      catch (error) {

        serialStatus.textContent =
          `${t("sendFailed")} ${
            error?.message ||
            error
          }`;

      }
      finally {

        if (port) {

          try {

            await port.close();

          }
          catch (_) {

            /*
             * The restarting ESP32
             * may already be disconnected.
             */

          }

        }


        wifiButton.disabled =
          false;

      }

    }
  );


  applyLanguage(
    currentLanguage
  );


  loadReleases();

</script>

</body>
</html>
